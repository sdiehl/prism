[package]
name = "spectra-intro"
version = "0.19.0"
authors = ["Stephen Diehl <stephen.m.diehl@gmail.com>"]
maintainers = ["stephen.m.diehl@gmail.com"]
license = "MIT"
description = "The Prism introduction deck, built with Spectra."
changes-files = ["../../CHANGELOG.md"]
license-files = ["../../LICENSE"]
homepage = "https://github.com/sdiehl/prism"
issues = "https://github.com/sdiehl/prism/issues"
online-doc = "https://sdiehl.github.io/prism/packages/spectra/index.html"
repo = "git+https://github.com/sdiehl/prism.git"

[bin]
entry = "src/Main.pr"

[dependencies]
spectra = { path = "../../packages/spectra" }

[spectra]
output = "spectra-intro.pdf"
