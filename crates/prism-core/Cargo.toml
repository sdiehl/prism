[package]
name = "prism-core"
version.workspace = true
authors.workspace = true
categories = ["compilers"]
edition.workspace = true
keywords = ["compiler", "cbpv", "effects", "llvm", "mlir"]
license.workspace = true
readme = "../../README.md"
repository.workspace = true
description = "Prism compiler workspace member: types, CBPV core, flags"

[dependencies]
blake3 = "1"
im = "15.1"
num-bigint = "0.5.0"
prism-common = { path = "../prism-common" }
prism-syntax = { path = "../prism-syntax" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
serde_stacker = "0.1"
stacker = "0.1"
thiserror = "2.0"
toml = { version = "1", optional = true }

[features]
native = ["dep:toml"]
# Cross-crate access to the effect-lowering test-injection hooks; enabled by
# the root crate's dev-dependency so integration tests reach them, never on
# in a production build.
test-hooks = []
