name: Install

# The curl-pipe-sh installer is a release artifact in its own right: it must
# keep working against the latest published release on every platform it
# claims. Runs when the script (or this workflow) changes, when a release is
# published, weekly to catch release-asset rot, and on demand.
on:
  pull_request:
    paths:
      - scripts/install.sh
      - .github/workflows/install.yml
  push:
    branches: [main]
    paths:
      - scripts/install.sh
      - .github/workflows/install.yml
  release:
    types: [published]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workflow only reads the checkout and public release assets.
permissions:
  contents: read

jobs:
  install:
    name: install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest is x86_64, ubuntu-24.04-arm is aarch64, macos-latest is
        # arm64: one runner per published tarball target.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The documented runtime prerequisite: native codegen shells out to clang.
      # Linux runners carry system LLVM already.
      - name: Install LLVM runtime (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm@22 || brew install llvm
      - name: Run the installer against the latest release
        # PRISM_NO_NIX pins the test to the tarball path; runners have no Nix,
        # but the pin keeps the exercised path explicit either way. The token
        # authenticates the api.github.com latest-release lookup, which is
        # rate-limited per IP and 403s on shared macOS runners.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: PRISM_NO_NIX=1 sh scripts/install.sh
      # The installer lands in ~/.prismup/bin when the release ships prismup
      # assets and ~/.local/bin when it predates them; resolve whichever this
      # release produced so the workflow stays green across that boundary.
      - name: Locate installed binary
        run: |
          for d in "$HOME/.prismup/bin" "$HOME/.local/bin"; do
            if [ -x "$d/prism" ]; then echo "PRISM_BIN=$d/prism" >> "$GITHUB_ENV"; exit 0; fi
          done
          echo "no prism binary found in ~/.prismup/bin or ~/.local/bin"; exit 1

      # Informational, not a gate: this workflow runs against the *published*
      # release, so it reports what the shipped artifact loads rather than
      # failing on it. Anything outside /usr/lib and /System is a dyld abort
      # waiting for a user without that prefix; release.yml is where that is
      # enforced, at the commit that can still fix it.
      - name: Report dylib dependencies (macOS)
        if: runner.os == 'macOS'
        run: otool -L "$(readlink -f "$PRISM_BIN")"

      - name: Installed binary runs
        run: |
          bin="$PRISM_BIN"
          "$bin" --version
          printf 'fn main() : Unit ! {IO} = println("install ok")\n' > /tmp/smoke.pr
          out="$("$bin" run /tmp/smoke.pr)"
          case "$out" in *"install ok"*) echo "smoke: $out" ;; *) echo "unexpected output: $out"; exit 1 ;; esac
